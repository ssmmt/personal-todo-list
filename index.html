<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>任务</title>
  <style>
    :root {
      font-family: "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #101727;
      background: #fff;
      --muted: #525d70;
      --line: #dce1e9;
      --accent: #385dbe;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .page {
      --page-top: 30px;
      --topbar-height: 42px;
      --entry-height: 44px;
      --compose-offset: calc(var(--page-top) + var(--topbar-height));
      display: flex;
      flex-direction: column;
      width: min(100% - 96px, 1180px);
      min-height: 100svh;
      margin-inline: auto;
      padding-top: var(--page-top);
    }

    .scene-art {
      position: absolute;
      inset: 0 0 auto auto;
      width: 92vw;
      height: 90dvh;
      object-fit: cover;
      object-position: right 46%;
      pointer-events: none;
      filter: brightness(var(--scene-light, 1)) saturate(var(--scene-color, 1));
      transition: filter 900ms ease;
      mask-image:
        radial-gradient(ellipse 94% 110% at 65% 14%, #000 54%, #000e 68%, #0007 84%, transparent 100%),
        linear-gradient(to top right, transparent 4%, #0005 24%, #000 56%),
        linear-gradient(to right, transparent 0%, #000 15%),
        linear-gradient(to bottom, #000 50%, #000c 73%, transparent 100%);
      mask-composite: intersect;
    }

    .page { position: relative; }
    .topbar { display: flex; justify-content: flex-end; height: var(--topbar-height); }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid #c6d0de;
      border-radius: 8px;
      background: rgb(255 255 255 / 92%);
      color: #20334f;
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .download:hover { border-color: #8295b2; background: #fff; }
    .download-icon { font-size: 1.125rem; line-height: 1; }

    main { flex: 1; }

    .compose {
      display: grid;
      justify-items: center;
      align-content: start;
      min-height: calc(70dvh - var(--compose-offset));
      padding-block: max(12px, calc(50dvh - var(--compose-offset) - var(--entry-height) / 2)) 26px;
      text-align: center;
    }

    #task-form {
      display: flex;
      width: min(calc(100% - 24px), 408px);
      gap: 8px;
    }

    #task-input {
      flex: 1;
      min-width: 0;
      min-height: var(--entry-height);
      padding: 0 12px;
      border: 1px solid #a9b2a0;
      border-radius: 8px;
      background: #f8f9f2;
      color: #2f432b;
    }

    #task-input::placeholder { color: #37462d; }

    .add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-inline: 14px;
      border: 1px solid #91a17f;
      border-radius: 8px;
      background: #d5e0c1;
      color: #243520;
      font-weight: 600;
      white-space: nowrap;
    }

    .add:hover { border-color: #71876b; background: #c6d5ae; }
    .add-icon { font-size: 1.125rem; font-weight: 400; line-height: 1; }
    #task-input:focus-visible, .add:focus-visible { outline-color: #4f6945; }

    @supports ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
      #task-input, .add {
        -webkit-backdrop-filter: blur(12px) saturate(112%);
        backdrop-filter: blur(12px) saturate(112%);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 55%);
      }

      #task-input {
        border-color: rgb(96 112 86 / 48%);
        background: rgb(251 252 246 / 71%);
      }

      .add {
        border-color: rgb(83 109 72 / 53%);
        background: rgb(192 209 169 / 78%);
      }

      .add:hover {
        border-color: rgb(76 101 65 / 66%);
        background: rgb(185 205 156 / 88%);
      }
    }

    .pending {
      width: min(100%, 390px);
      margin-bottom: 32px;
    }

    .pending-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #a5b2c5;
      padding-bottom: 12px;
    }

    h2 { margin: 0; font-size: 1.0625rem; font-weight: 650; }
    #remaining { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
    .hint, #empty { color: var(--muted); font-size: .875rem; }
    .hint { margin: 12px 0 0; }
    #empty { margin: 16px 0; }

    #task-list { margin: 0; padding: 0; list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    li label {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 48px;
      padding-block: 8px;
      cursor: pointer;
    }

    li input {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-text { overflow-wrap: anywhere; }

    .delete {
      min-height: 44px;
      padding-inline: 9px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: .875rem;
    }

    .delete:hover { color: #101727; text-decoration: underline; text-underline-offset: 3px; }
    #storage-warning { margin: 14px 0 0; color: #a1292c; font-size: .875rem; }

    @media (prefers-reduced-motion: reduce) {
      .scene-art { transition: none; }
    }

    @media (max-width: 640px) {
      .page { --page-top: 18px; width: calc(100% - 36px); }
      .scene-art { object-position: 68% 45%; opacity: .68; }
      .add { padding-inline: 11px; }
    }
  </style>
</head>

  <div class="page">
    <header class="topbar">
      <a class="download" id="download" href="./" download="todo.html" hidden>
        <span class="download-icon" aria-hidden="true">↓</span>下载离线版
      </a>
    </header>
    <main>
      <section class="compose" aria-label="添加任务">
        <form id="task-form">
          <input id="task-input" aria-label="新任务" placeholder="输入一件要做的事" type="text" required>
          <button class="add" type="submit"><span class="add-icon" aria-hidden="true">+</span>添加</button>
        </form>
        <p id="storage-warning" role="alert" hidden>浏览器暂时无法保存任务，刷新可能会丢失本次更改。</p>
      </section>

      <section class="pending" aria-labelledby="pending-title">
        <div class="pending-heading">
          <h2 id="pending-title">待完成</h2>
          <span id="remaining" role="status">0 项</span>
        </div>
        <p id="empty">暂无待完成任务</p>
        <ul id="task-list" aria-label="待完成任务" hidden></ul>
        <p class="hint" id="completion-hint" hidden>勾选后，任务会从清单中移除。</p>
      </section>
    </main>

  </div>

  <script>
    const storageKey = 'personal-todo-cn-v1';
    const form = document.querySelector('#task-form');
    const taskInput = document.querySelector('#task-input');
    const taskList = document.querySelector('#task-list');
    const empty = document.querySelector('#empty');
    const remaining = document.querySelector('#remaining');
    const completionHint = document.querySelector('#completion-hint');
    const storageWarning = document.querySelector('#storage-warning');
    const tasks = loadTasks();
    const sceneArt = document.querySelector('.scene-art');

    function beijingSunAltitude(now) {
      const radians = Math.PI / 180;
      const latitude = 39.9042 * radians;
      const longitude = 116.4074;
      const days = (now.getTime() - Date.UTC(2000, 0, 1, 12)) / 86400000;

      // Compute the Sun's angle above the horizon at Beijing, independent of the browser's time zone.
      const anomaly = (357.5291 + 0.98560028 * days) * radians;
      const center = (
        1.9148 * Math.sin(anomaly) +
        0.02 * Math.sin(2 * anomaly) +
        0.0003 * Math.sin(3 * anomaly)
      ) * radians;
      const solarLongitude = anomaly + center + 102.9372 * radians + Math.PI;
      const obliquity = 23.4397 * radians;
      const rightAscension = Math.atan2(
        Math.sin(solarLongitude) * Math.cos(obliquity),
        Math.cos(solarLongitude)
      );
      const declination = Math.asin(Math.sin(solarLongitude) * Math.sin(obliquity));
      const hourAngle = (280.16 + 360.9856235 * days + longitude) * radians - rightAscension;

      return Math.asin(
        Math.sin(latitude) * Math.sin(declination) +
        Math.cos(latitude) * Math.cos(declination) * Math.cos(hourAngle)
      ) / radians;
    }

    function updateSceneLight(now = new Date()) {
      const altitude = beijingSunAltitude(now);
      // Fade across twilight, through the time the Sun crosses the horizon.
      const twilight = Math.min(1, Math.max(0, (altitude + 8) / 16));
      const daylight = twilight * twilight * (3 - 2 * twilight);
      sceneArt.style.setProperty('--scene-light', (0.55 + 0.45 * daylight).toFixed(3));
      sceneArt.style.setProperty('--scene-color', (0.72 + 0.28 * daylight).toFixed(3));
    }

    updateSceneLight();
    window.setInterval(() => updateSceneLight(), 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateSceneLight();
    });

    if (location.protocol === 'https:' || location.protocol === 'http:') {
      document.querySelector('#download').hidden = false;
    }

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
        if (Array.isArray(saved)) {
          return saved.filter(task => typeof task?.text === 'string' && typeof task.done === 'boolean');
        }
      } catch {
        storageWarning.hidden = false;
      }
      return [];
    }

    function saveTasks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
        storageWarning.hidden = true;
      } catch {
        storageWarning.hidden = false;
      }
    }

    function updateSummary() {
      const pending = taskList.childElementCount;
      remaining.textContent = pending + ' 项';
      empty.hidden = pending > 0;
      taskList.hidden = pending === 0;
      completionHint.hidden = pending === 0;
    }

    function addTaskRow(task) {
      const row = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      const text = document.createElement('span');
      const deleteButton = document.createElement('button');

      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', '完成任务：' + task.text);
      text.className = 'task-text';
      text.textContent = task.text;
      label.append(checkbox, text);

      deleteButton.type = 'button';
      deleteButton.className = 'delete';
      deleteButton.textContent = '删除';
      deleteButton.setAttribute('aria-label', '删除任务：' + task.text);
      row.append(label, deleteButton);
      taskList.append(row);

      checkbox.addEventListener('change', () => removeTask('input'));
      deleteButton.addEventListener('click', () => removeTask('button'));

      function removeTask(control) {
        const nearbyRow = row.nextElementSibling ?? row.previousElementSibling;
        tasks.splice(tasks.indexOf(task), 1);
        row.remove();
        saveTasks();
        updateSummary();
        (nearbyRow?.querySelector(control) ?? taskInput).focus();
      }
    }

    taskInput.addEventListener('input', () => taskInput.setCustomValidity(''));

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = taskInput.value.trim();

      if (!text) {
        taskInput.setCustomValidity('请输入一件要做的事。');
        taskInput.reportValidity();
        return;
      }

      const task = { text, done: false };
      tasks.push(task);
      addTaskRow(task);
      saveTasks();
      updateSummary();
      form.reset();
      taskInput.focus();
    });

    tasks.filter(task => !task.done).forEach(addTaskRow);
    updateSummary();
  </script>
</body>
